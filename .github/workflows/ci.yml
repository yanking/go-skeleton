# 提交门槛的机器执行：宪法第 5 条的 make check 在 push / PR 上必跑。
# lint、vuln 与 race 不并进 check（理由见 README「里面有什么」与 Makefile 的注释），
# 各占一个 job 并行跑。工具链版本钉在 tools/go.mod，由 make tools 装进 bin/tools/——与本地一致。
#
# 宪法第 4 条（凭证只能写 ${ENV_NAME} 引用）的判据在 test/secrets/，它是普通的
# go test，所以已经被 check 覆盖，不另设 job。
name: ci

on:
  push:
    branches: [main, example]
  pull_request:
  # 漏洞是时间的函数，不是代码的函数：仓库一个月不动，期间公布的漏洞也要有人知道。
  # 只靠 push/PR 触发的话，模板仓安静下来就等于停止扫描了。
  schedule:
    - cron: "17 3 * * 1"
  # 允许手动触发：排查 CI 自身问题时不必靠空提交。
  workflow_dispatch:

permissions:
  contents: read

# 同一分支上新的 push 取消尚未跑完的那次：省队列，也避免看到过期结论。
# 定时任务与手动触发各自成组，不互相取消。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: make check

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: make race

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - run: make lint

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - run: make vuln

  # spec 校验不并进 check：openspec 是 Node 工具，而提交门槛要快、要零外部依赖
  # （宪法第 5 条）。spec 格式漂移的失效模式是「归档会把活文档写坏」，不是
  # 「代码跑不了」，CI 拦住就够。
  #
  # 版本钉住且与本机一致（同 tools/go.mod 对 Go 工具链的做法）：浮动版本会让同
  # 一份 spec 在不同时间得出不同结论，而那正是 CI 不该有的性质。升级是一次显式
  # 改动——`openspec install` 升本机，同一次提交里把下面这个版本号一起改。
  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g @fission-ai/openspec@1.14.3
      # --all 才会把 specs 与 changes 都纳入；不带它在空仓下是 "Nothing to
      # validate"，有东西了也只校验交互式选中的那一项。空仓退出 0，所以这个 job
      # 从第一天起就是绿的；有坏 spec 时退出 1（实测：无场景的 ADDED 需求即红）。
      - run: openspec validate --all --strict
