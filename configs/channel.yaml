# channel 服务配置：只放声明式参数；Writer、Extractors 等装配期注入项不在此出现。

log:
  name: channel
  level: info
  format: json

app:
  stop_timeout: 30s # 停机总超时，须 ≤ 部署侧宽限期；省略即取 pkg/app 的 30s 默认

telemetry:
  exporter: stdout # 本地开发直接打标准输出；生产改 otlp 并配 endpoint（如 collector:4317）

transport:
  grpc_addr: ":9092" # 业务协议出口(东西向,上游 gateway 直连);与 hello/user 错开本地端口

pgsql:
  write: "postgres://app:app@127.0.0.1:5432/app?sslmode=disable" # 渠道商户配置表;本地开发库,生产由部署侧下发
  max_open_conns: 20
  conn_max_lifetime: 30m

gateway:
  addr: "" # 上游 gateway-rpc 地址(补单对账回推用),如 "gateway-rpc:9080";留空即不装配对账 job
