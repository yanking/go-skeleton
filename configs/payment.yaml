# payment 服务配置：只放声明式参数；Writer、Extractors 等装配期注入项不在此出现。

log:
  name: payment
  level: info
  format: json

app:
  stop_timeout: 30s # 停机总超时，须 ≤ 部署侧宽限期；省略即取 pkg/app 的 30s 默认

telemetry:
  exporter: stdout # 本地开发直接打标准输出；生产改 otlp 并配 endpoint（如 collector:4317）

transport:
  grpc_addr: ":9093" # 业务协议出口(商户与网关直连);与 channel :9092 错开
  http_addr: ":8093" # gateway 转译出口(商户 HTTP/JSON、渠道回调、/docs);与代码里的 WithGateway 一并生效

pgsql:
  write: "postgres://app:app@127.0.0.1:5432/app?sslmode=disable" # 订单等六表;本地开发库,生产由部署侧下发
  max_open_conns: 20
  conn_max_lifetime: 30m

queue:
  addr: "127.0.0.1:6379" # 商户通知队列所用 Redis;须是 asynq 专用实例并配 noeviction + AOF
  db: 0
  concurrency: 10 # 通知并发消费数;零值取进程可用 CPU 数

channel:
  addr: "127.0.0.1:9092" # channel 服务 gRPC 地址,必填;生产按服务发现下发
  sync_interval: 5m # 渠道实例元数据同步周期;零值取 job 默认 5m

notify:
  callback_base_url: "http://127.0.0.1:8093" # 下发给渠道的回调基址,须渠道侧可达;生产填外网域名
