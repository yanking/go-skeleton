syntax = "proto3";

package user.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/yanking/go-skeleton/gen/user/v1;userv1";

// 用户服务
//
// 用户的创建与查询。错误统一以 google.rpc.Status 返回，HTTP 状态码由 gateway 映射。
service UserService {
  // 创建用户
  //
  // 邮箱全局唯一，已被占用时返回 AlreadyExists；参数校验失败返回 InvalidArgument 并附带违规字段明细。
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse) {
    option (google.api.http) = {
      post: "/v1/users"
      body: "*"
    };
  }

  // 按 ID 取用户
  //
  // 用户不存在时返回 NotFound。
  rpc GetUser(GetUserRequest) returns (GetUserResponse) {
    option (google.api.http) = {get: "/v1/users/{id}"};
  }
}

// 用户
message User {
  // 用户 ID，创建时由服务端分配。
  int64 id = 1;
  // 用户名，1~32 字符。
  string name = 2;
  // 邮箱，全局唯一。
  string email = 3;
  // 创建时间，由数据库默认值填充。
  google.protobuf.Timestamp created_at = 4;
}

// 创建用户的入参。校验注解由拦截器统一执行，service 层不重复校验。
message CreateUserRequest {
  // 用户名，1~32 字符。
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 32
  }];
  // 邮箱，须为合法邮箱格式。
  string email = 2 [(buf.validate.field).string.email = true];
}

// 创建用户的出参。
message CreateUserResponse {
  // 新建的用户。
  User user = 1;
}

// 取用户的入参。
message GetUserRequest {
  // 用户 ID，须为正数。
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
}

// 取用户的出参。
message GetUserResponse {
  // 查到的用户。
  User user = 1;
}
