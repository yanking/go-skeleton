// gateway-rpc 契约的镜像：仅含 channel 对账用到的两个 RPC，字段与 RPC 同
// gateway-backend 仓库的 gateway.proto 保持一致；消息命名按 buf lint 规则取
// *Response 后缀，与上游不同——消息名不参与线上编码，改名不影响互通。
// 上游契约变更时须同步本文件。
// channel 的补单 job 经此拉取未完结订单并回推状态变更。
syntax = "proto3";

package gateway.v1;

option go_package = "github.com/yanking/go-skeleton/gen/gateway/v1;gatewayv1";

// 未完结订单拉取入参。
message TripartiteUnfinishedOrdersRequest {
  // 渠道名，小写规范形式。
  string channel_name = 1;

  // 商户号。
  string merchant_no = 2;

  // 币种。
  string currency = 3;

  // 拉单窗口期（分钟），只取该窗口内创建的未完结单。
  int32 payment_period = 4;
}

// 未完结订单条目。
message TripartiteUnfinishedOrdersItem {
  // 网关侧订单号。
  string order_no = 1;

  // 渠道侧订单号，可能为空（下单未获得渠道单号时）。
  string out_order_no = 2;

  // 金额（分）。
  int64 amount = 3;
}

// 未完结订单拉取出参。
message TripartiteUnfinishedOrdersResponse {
  // 未完结代收单。
  repeated TripartiteUnfinishedOrdersItem payments = 1;

  // 未完结代付单。
  repeated TripartiteUnfinishedOrdersItem payouts = 2;
}

// 订单状态回推入参。
message TripartiteOrderCallbackRequest {
  // 渠道名，小写规范形式。
  string channel_name = 1;

  // 商户号。
  string merchant_no = 2;

  // 币种。
  string currency = 3;

  // 订单类型：1 代收 2 代付。
  int32 order_type = 4;

  // 网关侧订单号。
  string order_no = 5;

  // 渠道侧订单号。
  string out_order_no = 6;

  // 渠道确认的金额（分）。
  int64 amount = 7;

  // 回调结论：1 成功 2 失败。
  int32 callback_type = 8;

  // 渠道侧支付参考号，无则为空。
  string reference_no = 9;
}

// 订单状态回推出参，暂无字段（上游为 Empty），留作演进。
message TripartiteOrderCallbackResponse {}

// gateway-rpc 里 channel 侧要用的对账入口。
service GatewayService {
  // 拉取未完结订单
  //
  // 返回指定渠道商户实例窗口期内的未完结代收与代付单。
  rpc TripartiteUnfinishedOrders(TripartiteUnfinishedOrdersRequest) returns (TripartiteUnfinishedOrdersResponse);

  // 回推订单状态变更
  //
  // 金额一致才回推，由调用方保证。
  rpc TripartiteOrderCallback(TripartiteOrderCallbackRequest) returns (TripartiteOrderCallbackResponse);
}
